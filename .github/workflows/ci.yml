name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  build:
    name: Build extensions
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch vendor libraries (sha256-verified)
        run: npm run fetch:vendor
      - run: npm run build
      - name: Lint Firefox package (web-ext)
        run: npm run lint:ext
      - run: npm run zip
      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
