name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Build & attach release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run fetch:vendor
      - run: npm run build
      - run: npm run zip
      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" artifacts/*.zip --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: artifacts/*.zip
          retention-days: 7

  publish:
    name: Publish to ${{ matrix.store }}
    needs: [release-please, package]
    runs-on: ubuntu-latest
    # Store credentials live in this environment; add required reviewers to gate publishing.
    environment: store-publish
    strategy:
      fail-fast: false
      matrix:
        store: [chrome, edge, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts
      - name: Extract released Firefox package for signing
        if: matrix.store == 'firefox'
        run: mkdir -p dist/firefox && unzip -q artifacts/m3u8-hls-player-firefox-v*.zip -d dist/firefox
      - name: Publish
        run: npm run publish:${{ matrix.store }}
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PRODUCT_ID: ${{ secrets.PRODUCT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
